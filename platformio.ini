; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32doit-devkit-v1]
platform = espressif32
board = esp32doit-devkit-v1
framework = arduino

; Chip confirmado via esptool: ESP32-D0WD-V3 rev v3.0, dual core, flash 4MB.
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time

; Le o .env e vira -DWIFI_SSID / -DWIFI_PASSWORD. As credenciais ficam fora
; do repositorio; o modelo versionado e o .env.exemplo.
extra_scripts = pre:scripts/carrega_env.py

lib_deps =
  bodmer/TFT_eSPI@^2.5.43
  ; Puxa sozinha a Adafruit Unified Sensor e a Adafruit BusIO.
  adafruit/Adafruit BME280 Library@^2.2.4

; A TFT_eSPI e configurada por aqui, sem editar arquivos da biblioteca.
; USER_SETUP_LOADED desliga o User_Setup.h dela e faz valer o que esta abaixo.
build_flags =
  -DUSER_SETUP_LOADED=1

  ; --- driver do painel ---------------------------------------------------
  ; O GMT024-08 da GoldenMorning (mesma familia, 2,4" 240x320 SPI) usa
  ; ST7789V. Se a tela acender branca ou embaralhada, comente a linha do
  ; ST7789 e descomente a do ILI9341: sao os dois controladores usados
  ; nesse tamanho de painel.
  -DST7789_DRIVER=1
  ; -DILI9341_DRIVER=1

  -DTFT_WIDTH=240
  -DTFT_HEIGHT=320

  ; --- inversao de cor ------------------------------------------------------
  ; A sequencia de init do ST7789 na TFT_eSPI manda INVON sem condicao
  ; (TFT_Drivers/ST7789_Init.h). Depois dela a biblioteca so aplica INVON ou
  ; INVOFF se um dos dois estiver definido aqui. Sem nenhum, o painel fica
  ; invertido e fillScreen(TFT_BLACK) pinta branco. A maioria dos IPS precisa
  ; da inversao; este painel nao, entao desligamos de forma explicita.
  ; Se as cores sairem trocadas, troque por -DTFT_INVERSION_ON=1.
  -DTFT_INVERSION_OFF=1

  ; --- ligacao ao ESP32 ---------------------------------------------------
  ; Pinos escolhidos para nao cair em pino de strapping nem de boot.
  -DTFT_MOSI=23
  -DTFT_SCLK=18
  -DTFT_CS=13
  -DTFT_DC=27
  -DTFT_RST=26

  ; --- fontes embutidas ---------------------------------------------------
  -DLOAD_GLCD=1
  -DLOAD_FONT2=1
  -DLOAD_FONT4=1
  -DLOAD_FONT6=1
  -DLOAD_FONT7=1
  -DLOAD_GFXFF=1

  -DSPI_FREQUENCY=40000000

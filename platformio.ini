; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32doit-devkit-v1]
platform = espressif32
board = esp32doit-devkit-v1
framework = arduino

; Chip confirmado via esptool: ESP32-D0WD-V3 rev v3.0, dual core, flash 4MB.
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time

; Le o .env e vira -DWIFI_SSID / -DWIFI_PASSWORD. As credenciais ficam fora
; do repositorio; o modelo versionado e o .env.exemplo.
extra_scripts = pre:scripts/carrega_env.py

lib_deps =
  bodmer/TFT_eSPI@^2.5.43
  ; Puxa sozinha a Adafruit Unified Sensor e a Adafruit BusIO.
  adafruit/Adafruit BME280 Library@^2.2.4

; A TFT_eSPI e configurada por aqui, sem editar arquivos da biblioteca.
; USER_SETUP_LOADED desliga o User_Setup.h dela e faz valer o que esta abaixo.
build_flags =
  -DUSER_SETUP_LOADED=1

  ; --- driver do painel ---------------------------------------------------
  ; Modulo vermelho "4.0'' TFT SPI 480X320 V1.1", header de 14 pinos com
  ; touch resistivo e slot de cartao SD. E a familia MSP4020/MSP4021, que usa
  ; ST7796S. Se a tela acender branca ou embaralhada, comente a linha do
  ; ST7796 e descomente a do ILI9488, o outro controlador usado em 480x320.
  -DST7796_DRIVER=1
  ; -DILI9488_DRIVER=1

  ; Nativo do ST7796: 320 de largura por 480 de altura, em retrato.
  -DTFT_WIDTH=320
  -DTFT_HEIGHT=480

  ; --- inversao de cor ------------------------------------------------------
  ; O init do ST7796 na TFT_eSPI nao manda INVON (diferente do ST7789 do
  ; display anterior), entao este flag so deixa o INVOFF explicito.
  ; Se o preto sair branco, troque por -DTFT_INVERSION_ON=1.
  ; Se o vermelho e o azul sairem trocados, acrescente -DTFT_RGB_ORDER=TFT_RGB.
  -DTFT_INVERSION_OFF=1

  ; --- ligacao ao ESP32 ---------------------------------------------------
  ; Pinos escolhidos para nao cair em pino de strapping nem de boot. Os mesmos
  ; do display anterior: so os fios mudam de lugar no header.
  ; O SDO(MISO) do display nao e usado: nada e lido da tela. O LED da luz de
  ; fundo vai no GPIO17, com PWM feito no main.cpp (nao pela TFT_eSPI).
  ; Touch desligado: este modulo veio sem o chip XPT2046 (U2). O codigo do
  ; touch esta guardado em extras/touch/, com os flags que ele precisa.
  -DTFT_MOSI=23
  -DTFT_SCLK=18
  -DTFT_CS=13
  -DTFT_DC=27
  -DTFT_RST=26

  ; --- fontes embutidas ---------------------------------------------------
  -DLOAD_GLCD=1
  -DLOAD_FONT2=1
  -DLOAD_FONT4=1
  -DLOAD_FONT6=1
  -DLOAD_FONT7=1
  -DLOAD_GFXFF=1

  -DSPI_FREQUENCY=40000000
